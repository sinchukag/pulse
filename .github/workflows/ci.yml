name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"

jobs:
  # 1. Looks for leaked secrets in the code and the full Git history
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. Runs the pytest tests (no database needed)
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pytest httpx -r api/requirements.txt -r worker/requirements.txt

      - name: Run tests
        run: python -m pytest -v

  # 3. Builds both images and scans them for known vulnerabilities
  image-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Build images
        run: |
          docker build -t pulse-api:scan ./api
          docker build -t pulse-worker:scan ./worker

      - name: Scan images with Trivy (fail only on fixable HIGH/CRITICAL)
        run: |
          for img in pulse-api:scan pulse-worker:scan; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.58.0 image \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$img"
          done

  # 4. Your existing end-to-end smoke test (unchanged)
  build-and-test:
    needs: [unit-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Create .env from the example
        run: cp .env.example .env

      - name: Build and start Pulse
        run: docker compose up --build -d

      - name: Wait for the API to become healthy
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T api python -c "import urllib.request as u; u.urlopen('http://localhost:8000/health')"; then
              echo "API is healthy"
              exit 0
            fi
            echo "Waiting... ($i)"
            sleep 3
          done
          echo "API never became healthy"
          docker compose logs
          exit 1

      - name: Add a monitor and check the worker records a result
        run: |
          docker compose exec -T api python -c "
          import urllib.request as u, json
          req = u.Request('http://localhost:8000/monitors',
              data=json.dumps({'name':'GitHub','url':'https://github.com','interval_seconds':10}).encode(),
              headers={'Content-Type':'application/json','X-API-Key':'change-me'})
          print(u.urlopen(req).status)"
          sleep 25
          docker compose logs worker | grep "ok=True"

      - name: Show logs if something failed
        if: failure()
        run: docker compose logs

      - name: Shut down
        if: always()
        run: docker compose down -v

  publish:
    needs: [build-and-test, secrets-scan, image-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ghcr.io/sinchukag/pulse-api:latest
            ghcr.io/sinchukag/pulse-api:${{ github.sha }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          push: true
          tags: |
            ghcr.io/sinchukag/pulse-worker:latest
            ghcr.io/sinchukag/pulse-worker:${{ github.sha }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to the VM over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/pulse
            git pull
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.prod.yml up -d --force-recreate caddy
            docker image prune -f