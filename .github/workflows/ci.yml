name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Create .env from the example
        run: cp .env.example .env

      - name: Build and start Pulse
        run: docker compose up --build -d

      - name: Wait for the API to become healthy
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T api python -c "import urllib.request as u; u.urlopen('http://localhost:8000/health')"; then
              echo "API is healthy"
              exit 0
            fi
            echo "Waiting... ($i)"
            sleep 3
          done
          echo "API never became healthy"
          docker compose logs
          exit 1

      - name: Add a monitor and check the worker records a result
        run: |
          docker compose exec -T api python -c "
          import urllib.request as u, json
          req = u.Request('http://localhost:8000/monitors',
              data=json.dumps({'name':'GitHub','url':'https://github.com','interval_seconds':10}).encode(),
              headers={'Content-Type':'application/json'})
          print(u.urlopen(req).status)"
          sleep 25
          docker compose logs worker | grep "ok=True"

      - name: Show logs if something failed
        if: failure()
        run: docker compose logs

      - name: Shut down
        if: always()
        run: docker compose down -v
  
  publish:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ghcr.io/sinchukag/pulse-api:latest
            ghcr.io/sinchukag/pulse-api:${{ github.sha }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          push: true
          tags: |
            ghcr.io/sinchukag/pulse-worker:latest
            ghcr.io/sinchukag/pulse-worker:${{ github.sha }}      